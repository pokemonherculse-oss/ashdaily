function speciesScale(spec,opponent,form=''){

 if(['dialga','palkia','giratina','kyogre','groudon','rayquaza','eternatus','lugia','hooh','arceus'].includes(spec.id))scale+=.18;

function spritePixelSize(spec,opponent,form=''){
 const stage=document.querySelector('.classic-stage');
 const w=Math.max(320,stage?.clientWidth||window.innerWidth-32);

 const base=Math.min(118,Math.max(66,w*.108));
 const height=Number(spec.heightm)||1;
 const natural=Math.max(.83,Math.min(1.10,.89+Math.log2(height+1)*.06));
 let px=base*natural*(opponent?.90:1.13);
 if(['dialga','palkia','giratina','arceus','groudon','kyogre','rayquaza','lugia','hooh','zekrom','reshiram','kyurem','eternatus','xerneas','yveltal','solgaleo','lunala','necrozma'].includes(spec.id))px*=.78;
 if(form==='mega')px*=1.03;

}

rong><small>${Math.round(m.hp/m.maxHp*100)}% HP</small></div>`).join('')}</div></div></div></main>${footer()}${renderModal()}`;}

s, stats and names when online; only supported moves and modeled abilities have gameplay effects. A few rare move interactions and items are intentionally outside the game. All available moves have engine effects.</p></div></div><div class="modal-bottom"><span>FORMAT: ${esc(challenge.format.toUpperCase())} · SEED ${challenge.seed}</span><button class="btn btn-gold" data-action="close">READY TO BATTLE →</button></div></div></div>`;}

function battleTypeChartModal(){

function damageCalcModal(){
 const user=E.active(battle,0),foe=E.active(battle,1);
 const rows=user.moves.map(id=>{const m=M[id],p=E.damageEstimate(battle,user,foe,m,{first:E.speed(battle,0)>=E.speed(battle,1)});
 const accuracy=m.accuracy===0?100:m.accuracy;
 const ko=p.rolls.length?(100*p.rolls.filter(x=>x>=foe.hp).length/p.rolls.length):0;
 return `<tr><td><strong>${esc(m.name)}</strong><small>${m.type} · ${m.cat}</small></td><td>${m.power||'—'}</td><td>${p.effect}×</td><td>${p.min}–${p.max} HP<small>${Math.round(p.min/foe.maxHp*100)}–${Math.round(p.max/foe.maxHp*100)}% max HP</small></td><td>${accuracy}%</td><td>${ko}%</td></tr>`;}).join('');
 return `<div class="overlay" data-action="overlay"><section class="modal-card calc-modal" role="dialog" aria-modal="true" aria-label="Damage calculator"><button class="modal-close" data-action="close">×</button><div class="eyebrow">TURN-BY-TURN PREDICTIONS</div><h2>DAMAGE <span>CALCULATOR</span></h2><p class="calc-explain"><strong>${esc(user.name)}</strong> (Lv. ${user.level||50}) → <strong>${esc(foe.name)}</strong> (Lv. ${foe.level||50}) · ${esc(foe.name)} has ${foe.hp}/${foe.maxHp} HP · ${foe.types.join(' / ')}.</p><div class="chart-scroller"><table class="damage-table"><thead><tr><th>MOVE</th><th>POWER</th><th>TYPE</th><th>DAMAGE RANGE</th><th>ACC.</th><th>KO CHANCE</th></tr></thead><tbody>${rows}</tbody></table></div><p class="calc-explain">Damage is estimated using level, stats, power, type, abilities, held items and weather. The actual result may vary with accuracy and critical hits.</p><button class="btn btn-outline" data-action="close">BACK TO BATTLE</button></section></div>`;
}

function availableCatalog(){
 if(selected<0||!team[selected])return [];
 if(pickerKind==='item')return Object.keys(D.ITEMS).sort((a,b)=>a.localeCompare(b));
 const spec=S[team[selected].species];
 const ids=pickerScope==='all'?Object.keys(M):[...new Set([...team[selected].moves,...spec.pool])];
 return ids.filter(id=>M[id]).sort((a,b)=>M[a].name.localeCompare(M[b].name));
}
function catalogResults(){
 const all=availableCatalog(),q=pickerQuery.toLowerCase().trim();
 const matches=all.filter(id=>{const name=pickerKind==='item'?id:M[id].name;return (name+' '+(pickerKind==='move'?M[id].type+' '+M[id].cat:'' )).toLowerCase().includes(q);});
 const ids=matches.slice(0,100);
 return `<div class="catalog-note" id="catalog-count">${matches.length} matching ${pickerKind==='item'?'held items':pickerScope==='all'?'moves':'learnable moves'} ${matches.length>ids.length?`· showing first ${ids.length}; type to narrow`:''}</div><div class="catalog-results" id="catalog-results-list">${ids.length?ids.map(id=>{
 const m=M[id],name=pickerKind==='item'?id:m.name;
 const detail=pickerKind==='item'?D.ITEMS[id]||'Effect not yet simulated':`${m.type} · ${m.cat.toUpperCase()} · Power ${m.power||'—'} · ${m.pp} PP`;
 const simplify=pickerKind==='move'&&m.approx;
 const custom=pickerKind==='move'&&!S[team[selected].species].pool.includes(id);
 const isSelected=pickerKind==='item'?team[selected].item===id:team[selected].moves[pickerIndex]===id;
 return `<button class="catalog-option" data-action="choose-catalog" data-value="${esc(id)}"><strong>${isSelected?'✓ ':''}${esc(name)}</strong><small>${esc(detail)}</small>${simplify?'<span class="catalog-meta">Simplified effect</span>':''}${custom?'<span class="catalog-meta">Custom moveset · not in learnset</span>':''}</button>`;
 }).join(''):'<p>No entries match your search. Try another name.</p>'}</div>`;
}
function catalogModal(){return `<div class="overlay" data-action="overlay"><div class="modal-card catalog-modal" role="dialog" aria-modal="true" aria-label="Move and item picker"><button class="modal-close" data-action="close" aria-label="Close">×</button><div class="eyebrow">FULL BATTLE CATALOG</div><h2>CHOOSE ${pickerKind==='move'?`MOVE ${pickerIndex+1}`:'HELD ITEM'}</h2>${pickerKind==='move'?`<div class="catalog-scope"><button data-action="scope-moves" data-scope="all" class="${pickerScope==='all'?'chosen':''}">ALL MOVES</button><button data-action="scope-moves" data-scope="learnable" class="${pickerScope==='learnable'?'chosen':''}">LEARNABLE</button></div>`:''}<div class="catalog-filters"><input id="catalog-search" placeholder="Search ${pickerKind==='move'?'moves, types, or category':'any held item'}…" aria-label="Search catalog" autocomplete="off" value="${esc(pickerQuery)}"/></div><div id="catalog-list">${catalogResults()}</div><div class="catalog-note">Core effects are fully modeled where supported. Many additional moves and items are available to choose, but complex effects may be simplified. Full Gen 1–9 move/item choices require an online catalog; offline the shorter built-in list remains. Complex effects can be simplified. Custom movesets can exceed a Pokémon's normal learnset.</div></div></div>`;}
function renderModal(){if(modal==='catalog')return catalogModal();if(modal==='type-chart')return battleTypeChartModal();if(modal==='damage-calc')return damageCalcModal();if(modal==='help')return rulesModal();if(modal==='replay')return replayModal();if(modal==='quit')return `<div class="overlay" data-action="overlay"><div class="modal-card confirm-card" role="dialog" aria-modal="true"><div class="eyebrow">LEAVE THE ARENA?</div><h2>RETREAT FROM <span>THIS BATTLE?</span></h2><p>Your current battle will end, but you can retry the same daily challenge at any time.</p><div class="modal-bottom"><button class="btn btn-outline" data-action="close">STAY</button><button class="btn btn-gold" data-action="confirm-quit">QUIT BATTLE</button></div></div></div>`;return '';}
function render(){const priorTeamScroll=$('.team-panel')?.scrollTop||0;document.body.classList.toggle('reduce-motion',settings.reduceMotion);$('#app').innerHTML=mode==='builder'?renderBuilder():mode==='battle'?renderBattle():renderResult();if(mode==='builder'&&$('.team-panel'))$('.team-panel').scrollTop=priorTeamScroll;if(mode==='battle'){const el=$('#battle-log');if(el)el.scrollTop=el.scrollHeight;}if(battleError){console.warn(battleError);battleError='';}}
function renderRoster(){const el=$('#roster-grid');if(!el)return;const filtered=challenge.roster.map(id=>S[id]).filter(s=>(typeFilter==='All'||s.types.includes(typeFilter))&&(`${s.name} ${s.types.join(' ')} ${s.role}`.toLowerCase().includes(query.toLowerCase())));
 el.innerHTML=filtered.length?filtered.map(rosterCard).join(''):'<div class="empty-roster">No Pokémon match that search.</div>';
}
function setTeamFromAuto(){const smart=['garchomp','metagross','gardevoir','gastrodon','blaziken','dragapult','corviknight','clefable','weavile','toxapex','greninja','azumarill','charizard','excadrill','hydreigon','rotomwash'];const avail=smart.filter(id=>challenge.roster.includes(id));
 for(const id of challenge.roster)if(!avail.includes(id))avail.push(id);
 team=avail.slice(0,6).map(makeDefault);selected=0;render();}
function addOrRemove(id){const i=team.findIndex(p=>p.species===id);if(i!==-1){team.splice(i,1);selected=team.length?Math.min(team.length-1,Math.max(0,selected)): -1;}else{if(team.length>=6){selected=5;return;}team.push(makeDefault(id));selected=team.length-1;}render();}
function changeMove(index,id){const conf=team[selected],existing=conf.moves.indexOf(id);if(existing===index)return;
 if(existing>=0){const old=conf.moves[index];conf.moves[index]=id;conf.moves[existing]=old;}else conf.moves[index]=id;
 render();}
function startBattle(){if(team.length!==6)return;
 if(legendaryRule==='one'&&team.filter(x=>S[x.species]?.legendary).length>1){teamNotice='Only 1 Legendary permitted in this mode.';render();return;}
 if(legendaryRule==='only'&&team.some(x=>!S[x.species]?.legendary)){teamNotice='Select six Legendaries for Legendary Only mode.';render();return;}
 try{battle=E.createBattle(team,challenge.ash,challenge.seed,{rules:challenge.rules,format:challenge.format,weather:challenge.weather,terrain:challenge.terrain});mode='battle';started=Date.now();resultRecorded=false;pendingGimmick='';narrativeHistory=[];lastAttacks=['Choose your move','Ash is waiting…'];render();void playOpeningPokeballs();window.scrollTo?.({top:0,behavior:'instant'});sound('start');}catch(err){alert('Unable to start: '+err.message);}}
function sound(which){if(!settings.sound)return;
 try{const AudioContext=root.AudioContext||root.webkitAudioContext;if(!AudioContext)return;const ctx=new AudioContext(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=which==='win'?'sine':'triangle';osc.frequency.value=which==='win'?660:which==='hit'?174:440;gain.gain.setValueAtTime(.045,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.12);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.13);osc.onended=()=>ctx.close();}catch{}
}
function ensureAshReplacement(){if(!battle||battle.phase==='ended')return;
 let count=0;while(E.active(battle,1).hp===0&&E.alive(battle,1).length&&count++<6){let a=D.ai.chooseReplacement(battle,challenge.difficulty)||E.legalActions(battle,1).find(a=>a.type==='switch');if(!a)break;E.forceSwitch(battle,1,a.index);}
 E.checkWinner(battle);
}
function playAction(action){if(!battle||battle.phase==='ended'||turnAnimating)return;
 turnAnimating=true;
 const busy=$('#turn-progress');if(busy)busy.textContent='RESOLVING TURN…';
 document.querySelectorAll('#battle-moves button, #your-bench button').forEach(el=>{el.disabled=true;});
 if(E.active(battle,0).hp===0){
  if(action.type==='switch'){
   try{
    E.forceSwitch(battle,0,action.index);
    ensureAshReplacement();
    showNarrative({kind:'switch',message:'Go, '+E.active(battle,0).name+'!',snapshot:battle.turnEvents.at(-1)?.snapshot},0,1);
    void animatePokeballSwitch(0,E.active(battle,0),{skipDepart:true})
     .catch(err=>{console.error('Replacement animation error',err);})
     .finally(()=>{
      turnAnimating=false;
      if(mode==='battle'){
       updateBattleDom();
       const progress=$('#turn-progress');
       if(progress)progress.textContent='READY · SELECT NEXT MOVE';
      }
     });
   }catch(e){turnAnimating=false;updateBattleDom();alert(e.message);}
   return;
  }
  turnAnimating=false;updateBattleDom();return;
 }
 if(!E.isLegal(battle,0,action)){turnAnimating=false;updateBattleDom();return;}
 try{const ash=D.ai.chooseAction(battle,challenge.difficulty,null); // Predicts from visible moves; no button peeking.
 if(!ash)throw Error('No legal Ash action.');
 const before=[E.active(battle,0).id,E.active(battle,1).id];
 E.performTurn(battle,action,ash);ensureAshReplacement();pendingGimmick='';
 if(battle.phase==='ended')sound(battle.winner===0?'win':'hit');
 void animateBattleTurn(battle.turnEvents.slice(),before);}catch(err){turnAnimating=false;updateBattleDom();battleError=err.message;console.error('Battle error',err);alert('Battle action error: '+err.message);}
}
function dispatch(button){const action=button.dataset.action;if(!action)return;
 if(action==='next-story'){storyRelease?.();return;}
 if(action==='sound'){settings.sound=!settings.sound;save('dm8-settings-v1',settings);render();if(settings.sound)sound('start');}
 else if(action==='motion'){settings.reduceMotion=!settings.reduceMotion;save('dm8-settings-v1',settings);render();}
 else if(action==='help'){modal='help';render();}
 else if(action==='type-chart'||action==='damage-calc'){modal=action;render();}
 else if(action==='close'||action==='overlay'){modal='';render();}
 else if(action==='scroll-roster'){$('#roster-section')?.scrollIntoView({behavior:settings.reduceMotion?'auto':'smooth'});}
 else if(action==='roster'){teamTouched=true;addOrRemove(button.dataset.id);}
 else if(action==='quick'){teamTouched=true;setTeamFromAuto();}
 else if(action==='remove'){teamTouched=true;const i=Number(button.dataset.index);team.splice(i,1);selected=team.length?Math.min(i,team.length-1):-1;render();}
 else if(action==='edit-slot'){selected=Number(button.dataset.index);render();}
 else if(action==='lead-prev'||action==='lead-next'){teamTouched=true;if(selected<0)return;const to=selected+(action==='lead-prev'?-1:1);if(to<0||to>=team.length)return;[team[selected],team[to]]=[team[to],team[selected]];selected=to;render();}
 else if(action==='start')startBattle();
 else if(action==='gimmick'){pendingGimmick=button.dataset.kind;updateBattleDom();}
 else if(action==='move'){const id=button.dataset.move;playAction({type:'move',move:id,...(pendingGimmick?{gimmick:pendingGimmick}:{})});}
 else if(action==='switch')playAction({type:'switch',index:Number(button.dataset.index)});
 else if(action==='wait-turn')playAction({type:'wait'});
 else if(action==='struggle')playAction({type:'struggle'});
 else if(action==='quit'){modal='quit';render();}
 else if(action==='confirm-quit'||action==='edit'){modal='';mode='builder';battle=null;render();}
 else if(action==='rematch'){modal='';startBattle();}
 else if(action==='replay'){modal='replay';render();}
 else if(action==='roster-prev'){rosterPage=Math.max(0,rosterPage-1);renderRoster();}
 else if(action==='roster-next'){rosterPage++;renderRoster();}
 else if(action==='full-screen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();}

'}`:`${rosterError?'⚠ '+esc(rosterError):'⌛ Loading all Gen 1–9 Pokémon… meanwhile the curated roster is playable.'}`}</div>${rosterGridHtml()}<div class="roster-footer"><span>Choose manually or reroll as often as you want.</span><span>Click a squad slot, then select a Pokémon to replace it.</span></div></section>`;}

function setTeamFromAuto(){
 const pool=challenge.roster.map(id=>S[id]).filter(Boolean).filter(s=>{
  if(legendaryRule==='only')return Boolean(s.legendary);
  const bst=s.base.reduce((a,b)=>a+b,0);
  return !s.nfe&&(bst>=490||['azumarill','clefable','toxapex','gastrodon','rotomwash','weavile','blaziken','mimikyu','rillaboom'].includes(s.id));
 });
 if(pool.length<6){teamNotice='Not enough strong Pokémon loaded to roll six.';render();return;}
 let picked=[],used=new Set(),legendCount=0;
 for(let slot=0;slot<6;slot++){
  const choices=pool.filter(s=>!used.has(s.id)&&(legendaryRule==='only'?s.legendary:(!s.legendary||legendCount===0)));
  if(!choices.length)break;
  let best=null,bestScore=-Infinity;
  for(const s of choices){
   const bst=s.base.reduce((a,b)=>a+b,0),typeOverlap=picked.reduce((n,p)=>n+s.types.filter(t=>p.types.includes(t)).length,0);
   const speedy=s.base[5]>=100?17:0;
   const attack=Math.max(s.base[1],s.base[3]);
   const attacksCovered=new Set(picked.flatMap(x=>x.types));
   const freshTypes=s.types.filter(t=>!attacksCovered.has(t)).length;
   const roleBonus=(slot>2&&picked.every(p=>p.base[1]>p.base[3])&&s.base[3]>s.base[1])?38:0;
   const score=bst*.63+attack*.5+speedy+freshTypes*40-typeOverlap*95+roleBonus+Math.random()*135;
   if(score>bestScore){bestScore=score;best=s;}
  }
  if(!best)break;
  picked.push(best);used.add(best.id);if(best.legendary)legendCount++;
 }
 if(picked.length===6){team=picked.map(s=>makeDefault(s.id));selected=0;teamNotice='Strong six ready · '+legendCount+' Legendary'+(legendCount===1?'':' Pokémon')+' · mix of types and battle roles.';}
 else teamNotice='Could not complete this six. Try another roll.';
 render();
}
function updateHP(side,shown){const mon=shown||E.active(battle,side),root=document.querySelector(`[data-mon-side="${side}"]`);if(!root)return;

async function showMoveFx(event,side,onImpact=()=>{},willHit=true){
 const stage=$('.classic-stage'),attacker=$(side===0?'#player-combat-art .combat-mon':'#opponent-combat-art .combat-mon');

 const target=selfEffect?attacker:defender;
 if(settings.reduceMotion){onImpact();return;}
 const inferred=label.startsWith('Max ')?label.slice(4):label==='G-Max Terror'?'Ghost':'Normal';
 const type=(move?.type||inferred).toLowerCase(),color=BATTLE_COLORS[type]||'#ffffff';
 const start=battleCenter(attacker),end=battleCenter(target),fx=$('#battle-fx');
 if(move?.hazard){const ridge=$(side===0?'.field-ridge-top':'.field-ridge-bottom');if(ridge){const e=battleCenter(ridge);end.x=e.x;end.y=e.y;}}
 const travel=battlePace().travel,after=battlePace().after;

 const cleanup=[];

   ],{duration:travel+after,easing:'ease-in-out'});
   await pause(Math.round(travel*.66));
  }else{

   attacker.classList.add('fx-attack');
   if(fx){

     const shot=document.createElement('i');shot.className='move-fx fx-'+type;

     shot.style.setProperty('--sx',(isStatus?end.x:start.x)-7+'px');shot.style.setProperty('--sy',(isStatus?end.y:start.y)-7+'px');

     img.addEventListener('error',()=>{if(!img.dataset.backup&&primary!==fallback){img.dataset.backup='1';img.src='https://play.pokemonshowdown.com/fx/'+fallback+'.png';}else img.remove();});
     img.addEventListener('load',()=>shot.classList.add('has-move-sprite'));
     shot.appendChild(img);fx.appendChild(shot);cleanup.push(shot);
    }
   }
   await pause(travel);
  }
  hit(); // HP and faint snapshot begin exactly at visual contact.
  if(willHit&&!selfEffect&&target===defender){
   defender.classList.add('fx-hit');stage.classList.add('fx-shake');
   if(fx){
    const impact=document.createElement('i');impact.className='move-impact';impact.style.left=end.x+'px';impact.style.top=end.y+'px';impact.style.setProperty('--fx-color',color);impact.style.setProperty('--fx-impact',after+'ms');fx.appendChild(impact);cleanup.push(impact);
    const pic=document.createElement('img');pic.className='move-impact-sprite';pic.alt='';pic.src='https://play.pokemonshowdown.com/fx/'+(isPhysical?(SHOWDOWN_FX[mid]||'impact'):'impact')+'.png';pic.style.left=end.x+'px';pic.style.top=end.y+'px';pic.style.setProperty('--fx-impact',after+'ms');fx.appendChild(pic);cleanup.push(pic);
    for(let i=0;i<5;i++){const spark=document.createElement('i'),a=i*Math.PI*2/5;spark.className='fx-spark';spark.style.left=end.x+'px';spark.style.top=end.y+'px';spark.style.setProperty('--fx-color',color);spark.style.setProperty('--vx',Math.round(Math.cos(a)*35)+'px');spark.style.setProperty('--vy',Math.round(Math.sin(a)*32)+'px');spark.style.setProperty('--fx-impact',after+'ms');fx.appendChild(spark);cleanup.push(spark);}

    say(evt);
    await animatePokeballSwitch(side,newMon,{snapshot:evt.snapshot?.[side],recalled,skipDepart:recalled||previousFaint});
    shown[side]=newMon.id;
    await waitForReading(battlePace().switchRead);
   }else if(evt.kind==='move'){
    say(evt);
    const attackerName=evt.message.split(' used ')[0];
    let side=evt.snapshot?.[0]?.name===attackerName?0:evt.snapshot?.[1]?.name===attackerName?1:-1;
    if(side<0)side=S[shown[0]]?.name===attackerName?0:1;
    // Collect this move's own events ONLY; never assign a later switch or attack's HP to this hit.
    let next=i+1;
    while(next<events.length&&!['move','switch','recall','gimmick','turn'].includes(events[next].kind))next++;
    const outcome=events.slice(i+1,next),initial=evt.snapshot?.[1-side];
    const hit=outcome.find(e=>e.kind==='damage'&&e.snapshot?.[1-side]?.id===initial?.id&&e.snapshot[1-side].hp<initial.hp);
    const fail=outcome.some(e=>['miss','immune'].includes(e.kind)||/protected itself|blocked the move|move failed|Disguise absorbed/.test(e.message));
    // Projectile travel is complete at exactly the same instant we apply HP loss.
    await showMoveFx(evt,side,()=>{if(hit)syncSnapshot(hit);},Boolean(hit)||(!fail&&outcome.some(e=>e.kind==='status')));
    // Keep the move name and hit result visible instead of immediately replacing the text.
    await waitForReading(battlePace().moveRead);
   }else if(evt.kind==='heal'){
    syncSnapshot(evt);say(evt);await waitForReading(Math.max(450,battlePace().switchRead));
   }else if(evt.kind==='hazard'){
    const side=evt.snapshot?.[0]?.name&&evt.message.includes(evt.snapshot[0].name)?0:1;
    const node=$(side===0?'#player-combat-art .combat-mon':'#opponent-combat-art .combat-mon');
    node?.classList.add('fx-hit');await pause(settings.reduceMotion?0:260);node?.classList.remove('fx-hit');
   }else if(evt.kind==='faint'){
    say(evt);
    const name=evt.message.replace(/ fainted!$/,'');
    for(const side of [0,1]){
     if(S[shown[side]]?.name!==name)continue;
     const node=$(side===0?'#player-combat-art .combat-mon':'#opponent-combat-art .combat-mon');
     if(node&&!settings.reduceMotion){node.style.setProperty('--faint-duration',battlePace().faint+'ms');node.classList.add('poke-faint');}
     break;
    }
    await pause(battlePace().faint);
    await waitForReading(battlePace().faintRead);
   }else if(evt.kind==='gimmick'){
    const kind=/MEGA EVOLUTION/.test(evt.message)?'mega':/GIGANTAMAX/.test(evt.message)?'gmax':/Z-POWER/.test(evt.message)?'z':null;
    if(kind){const id=kind==='mega'?'lucario':kind==='gmax'?'gengar':'pikachu';
     const side=evt.actorSide===0||evt.actorSide===1?evt.actorSide:(evt.snapshot?.[0]?.id===id?0:1);
     say(evt);
     await formEffect(kind,side);
     if(kind!=='z'){const mon=battle.sides[side].team.find(m=>m.id===id);if(mon&&mon[kind]){const holder=$(side===0?'#player-combat-art':'#opponent-combat-art');if(holder)holder.innerHTML=combatArt({...mon,...(evt.snapshot?.[side]||{})},side===1);}}
     syncSnapshot(evt);
     await waitForReading(Math.round(battlePace().switchRead*.85));
    }
   }else if(['effective','resisted','immune','miss'].includes(evt.kind)){
    say(evt);await readEvent(evt);
   }else{
    // Silent item/recoil/weather changes get their own HP events, without fake attacks.
    syncSnapshot(evt);
   }
  }
  if(battle.phase==='ended'){mode='result';render();}
  else{updateBattleDom();const label=$('#turn-progress');if(label)label.textContent='READY · SELECT NEXT MOVE';}
 }finally{turnAnimating=false;$('#battle-fx')?.replaceChildren();if(mode==='battle')updateBattleDom();}
}

// Refit sprite dimensions when the browser or fullscreen arena changes size.
window.addEventListener('resize',()=>{if(mode!=='battle'||!battle)return;for(const side of [0,1]){
 const mon=E.active(battle,side),node=document.querySelector((side===0?'#player-combat-art':'#opponent-combat-art')+' .combat-mon');
 if(node)node.style.setProperty('--battle-sprite-px',spritePixelSize(S[mon.id],side===1,mon.mega?'mega':mon.gmax?'gmax':'')+'px');
}});

// --- end UI refinements ---
document.addEventListener('change',e=>{if(e.target?.id==='battle-speed'){settings.playback=['slow','normal','fast'].includes(e.target.value)?e.target.value:'slow';save('dm8-settings-v1',settings);return;}if(e.target?.id==='legend-rule'){legendaryRule=e.target.value==='only'?'only':'one';teamTouched=true;rosterPage=0;teamNotice='';setTeamFromAuto();}});
 setTeamFromAuto();
D.catalogLoader.loadItems().then(()=>{if(mode==='builder')render();}).catch(e=>console.warn('Using offline item choices:',e));
D.catalogLoader.loadMoves().catch(e=>console.warn('Using offline move choices:',e)).then(()=>D.dexLoader.load()).then(info=>{challenge=D.challenges.generate(today,debugSeed);rosterError='';if(mode==='builder'){if(!teamTouched)setTeamFromAuto();else render();}}).catch(err=>{rosterError='Full Gen 1–9 data unavailable without internet. Showing the curated roster.';console.warn(err);if(mode==='builder')render();});
root.DM8_APP={getChallenge:()=>challenge,getBattle:()=>battle,getTeam:()=>E.deep(team),autoDraft:setTeamFromAuto,startBattle,playAction};
})(globalThis);

</script>
</body>
